; PlatformIO project configuration — IDP ESP32 Edge
;
; Pinned to espressif32 6.7.x (Arduino-ESP32 2.0.x) so that:
;   - NimBLE-Arduino 1.4.x API is binary-compatible
;   - esp_task_wdt_init() uses the (timeout, panic) signature
; Bumping to platform 7.x will require minor refactors in main.cpp
; (watchdog config struct) and blesvc.cpp (NimBLE 2.x callback signatures).

[env:esp32dev]
platform        = espressif32 @ ~6.7.0
board           = esp32dev
framework       = arduino

board_build.filesystem = littlefs

monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, time

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    h2zero/NimBLE-Arduino @ ^1.4.1

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MQTT_MAX_PACKET_SIZE=1024
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
